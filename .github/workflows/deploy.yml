name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Erlaubt einen manuellen Lauf über den Actions-Tab, ohne Commit.
  workflow_dispatch:

# Die Berechtigungen, die actions/deploy-pages braucht.
permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Deployments vermeiden, laufende aber nicht abbrechen:
# ein halb ausgerollter Pages-Stand wäre schlimmer als ein paar Sekunden Wartezeit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # package.json verlangt >=22.12.0
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # site/base kommen aus der Pages-Konfiguration, damit der Build auch dann
        # stimmt, wenn das Repo umbenannt oder eine eigene Domain hinterlegt wird.
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
